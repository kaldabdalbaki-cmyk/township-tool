name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev git zip unzip
          pip install --upgrade pip
          pip install buildozer cython
      - name: Create Clean Buildozer Spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Township Tool
          package.name = township
          package.domain = org.township
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 1.0
          requirements = python3,kivy,tkinter
          orientation = portrait
          fullscreen = 0
          android.api = 33
          android.minapi = 21
          android.sdk_build_tools_version = 33.0.2
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
      - name: Build APK with Buildozer
        run: |
          buildozer --debug -v android debug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
